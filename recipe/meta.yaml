{% set name = "espaloma_charge" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/choderalab/espaloma_charge/archive/v{{ version }}.tar.gz
  sha256: f7f73bd6511da4cf5b9d58d4530005fcf68a44a6da9949e2269ab11d1263fb5a
  patches:
    - 000-update-versioneer.patch

build:
  entry_points:
    - espaloma_charge=espaloma_charge.cli:espaloma_charge
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - numpy
    - python >={{ python_min }}
    - pytorch
    - rdkit
    - dgl ~=2.0
    - torchdata <0.10  # https://github.com/pytorch/data/issues/1196#issuecomment-2542528439

test:
  imports:
    - espaloma_charge
  commands:
    - pip check
    - espaloma_charge --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/choderalab/espaloma_charge
  summary: Standalone charge assignment from Espaloma framework
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mikemhenry
    - yuanqing-wang
    - ijpulidos
